[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.50",
    "databento>=0.74.0",
    "exchange-calendars>=4.5",
    "httpx>=0.28",
    "ib-insync>=0.9",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "psutil>=5.9",
    "pyarrow>=21.0.0",
    "python-dotenv>=1.2.2",
    "yfinance",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-timeout>=0.5",
]

[tool.pytest.ini_options]
# Exclude live integration tests from standard runs; use -m integration to opt in explicitly.
# 60 s ceiling prevents any single test from hanging the suite indefinitely.
addopts = "--timeout=60 -m 'not integration'"
markers = [
    "integration: marks tests as integration tests requiring live network access (deselect with '-m not integration')",
]
